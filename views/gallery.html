<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie Photos - Partagez vos souvenirs</title>
  <style>
    :root {
      --primary: #76c893;
      --primary-dark: #52b69a;
      --accent: #ffdd00;
      --accent-light: #fff3b0;
      --light: #f8f9fa;
      --dark: #2d3033;
      --gray: #6c757d;
      --border: #d8e2dc;
      --success: #57cc99;
      --error: #e63946;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      color: var(--dark);
      line-height: 1.6;
      background-color: #f0f7f0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 1.5rem;
      border-radius: 12px;
      background-color: var(--primary);
      color: white;
      box-shadow: 0 8px 15px rgba(118, 200, 147, 0.2);
    }
    
    h1, h2 {
      font-weight: 700;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: white;
    }
    
    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }
    
    h2 {
      font-size: 1.8rem;
      margin: 2.5rem 0 1.5rem;
      border-bottom: 3px solid var(--accent);
      padding-bottom: 0.5rem;
      color: var(--primary-dark);
      display: inline-block;
    }
    
    /* Upload Container */
    .upload-container {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      margin-bottom: 3rem;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    
    .upload-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .file-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 2rem;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      background-color: rgba(118, 200, 147, 0.05);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    
    .file-upload:hover {
      border-color: var(--accent);
      background-color: rgba(255, 221, 0, 0.05);
    }
    
    .file-upload i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    
    .file-upload input {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }
    
    .file-upload-label {
      text-align: center;
    }
    
    .file-upload-label h3 {
      margin: 0;
      color: var(--primary-dark);
      font-weight: 600;
    }
    
    .file-upload-label p {
      margin: 0.5rem 0 0;
      color: var(--gray);
      font-size: 0.95rem;
    }
    
    .file-name {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--gray);
      font-style: italic;
      text-align: center;
    }
    
    button {
      padding: 0.8rem 2rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(118, 200, 147, 0.25);
    }
    
    button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(118, 200, 147, 0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .btn-wrapper {
      text-align: center;
      margin-top: 1.5rem;
    }
    
    button i {
      font-size: 1.2rem;
    }
    
    /* Messages */
    .message {
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .success {
      background-color: rgba(87, 204, 153, 0.15);
      color: var(--success);
      border: 1px solid rgba(87, 204, 153, 0.3);
    }
    
    .error {
      background-color: rgba(230, 57, 70, 0.15);
      color: var(--error);
      border: 1px solid rgba(230, 57, 70, 0.3);
    }
    
    /* Gallery */
    .section-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    
    .section-title i {
      color: var(--primary);
    }
    
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
      margin-top: 2rem;
    }
    
    .gallery-item {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      position: relative;
    }
    
    .gallery-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .gallery-item:hover {
      transform: translateY(-7px);
      box-shadow: 0 12px 30px rgba(118, 200, 147, 0.15);
    }
    
    .gallery-item:hover::after {
      opacity: 1;
    }
    
    .gallery-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }
    
    .image-info {
      padding: 1.2rem;
      background: white;
    }
    
    .image-name {
      font-weight: 600;
      margin-bottom: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--dark);
    }
    
    .image-date {
      font-size: 0.9rem;
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    
    .image-date i {
      color: var(--primary);
      font-size: 0.85rem;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.2rem;
      }
      
      .header {
        padding: 1.2rem 1rem;
      }
    }
    
    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="message" class="message"></div>
  
  <div class="header">
    <h1><i class="fas fa-camera-retro"></i> Galerie Photos</h1>
    <p>Partagez vos plus beaux souvenirs et créez une collection personnelle</p>
  </div>
  
  <div class="upload-container">
    <form id="uploadForm" enctype="multipart/form-data">
      <div class="form-group">
        <div class="file-upload">
          <i class="fas fa-cloud-arrow-up"></i>
          <div class="file-upload-label">
            <h3>Déposez votre image ici</h3>
            <p>ou cliquez pour parcourir vos fichiers (JPG, PNG, GIF)</p>
          </div>
          <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif" required>
        </div>
        <div id="fileName" class="file-name"></div>
      </div>
      <div class="btn-wrapper">
        <button type="submit"><i class="fas fa-upload"></i> Télécharger l'image</button>
      </div>
    </form>
  </div>
  
  <div class="section-title">
    <h2><i class="fas fa-images"></i> Votre Collection</h2>
  </div>
  
  <div id="gallery" class="gallery">
    <!-- Images will be loaded here -->
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('uploadForm');
      const gallery = document.getElementById('gallery');
      const message = document.getElementById('message');
      const fileInput = document.getElementById('image');
      const fileNameDisplay = document.getElementById('fileName');
      
      // Afficher le nom du fichier sélectionné
      fileInput.addEventListener('change', (e) => {
        if (fileInput.files.length > 0) {
          fileNameDisplay.textContent = `Fichier sélectionné: ${fileInput.files[0].name}`;
        } else {
          fileNameDisplay.textContent = '';
        }
      });
      
      // Gestion du drag and drop
      const fileUpload = document.querySelector('.file-upload');
      
      fileUpload.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileUpload.style.borderColor = 'var(--accent)';
        fileUpload.style.backgroundColor = 'rgba(255, 221, 0, 0.1)';
      });
      
      fileUpload.addEventListener('dragleave', () => {
        fileUpload.style.borderColor = 'var(--primary)';
        fileUpload.style.backgroundColor = 'rgba(118, 200, 147, 0.05)';
      });
      
      fileUpload.addEventListener('drop', (e) => {
        e.preventDefault();
        fileUpload.style.borderColor = 'var(--primary)';
        fileUpload.style.backgroundColor = 'rgba(118, 200, 147, 0.05)';
        
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          fileNameDisplay.textContent = `Fichier sélectionné: ${e.dataTransfer.files[0].name}`;
        }
      });
      
      // Charger les images au démarrage
      loadImages();
      
      // Gérer l'upload
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        
        try {
          const response = await fetch('/upload', {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          
          if (response.ok) {
            showMessage('Votre image a été ajoutée à la collection!', 'success');
            loadImages();
            form.reset();
            fileNameDisplay.textContent = '';
          } else {
            showMessage(data.error || 'Erreur lors du téléchargement', 'error');
          }
        } catch (err) {
          showMessage('Erreur de connexion', 'error');
          console.error(err);
        }
      });
      
      async function loadImages() {
        try {
          const response = await fetch('/upload/images');
          const { images } = await response.json();
          
          gallery.innerHTML = images.map(img => {
            // Use a relative URL path instead of hardcoded localhost
            const imgUrl = `/uploads/${img}`;
            const uploadDate = new Date().toLocaleDateString('fr-FR');
            
            return `
              <div class="gallery-item">
                <img src="${imgUrl}" alt="${img}" class="gallery-img"
                     onerror="this.src='/placeholder.png'; this.parentNode.classList.add('error');">
                <div class="image-info">
                  <div class="image-name">${img.split('.')[0]}</div>
                  <div class="image-date">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Ajouté le ${uploadDate}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } catch (err) {
          console.error('Erreur:', err);
          showMessage('Impossible de charger les images', 'error');
        }
      }
      
      function showMessage(msg, type) {
        message.innerHTML = `
          <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
          <span>${msg}</span>
        `;
        message.className = `message ${type}`;
        setTimeout(() => {
          message.innerHTML = '';
          message.className = 'message';
        }, 5000);
      }
    });
  </script>
</body>
</html>
