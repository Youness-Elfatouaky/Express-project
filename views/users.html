<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Users</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #d4e157 0%, #c6ff00 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      color: #388e3c;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.7rem 1.5rem;
      background: linear-gradient(135deg, #66bb6a, #c6ff00);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: linear-gradient(135deg, #c6ff00, #66bb6a);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to Users Page</h1>
    <a href="/" class="btn">Back to Home</a>
    <a href="/date" class="btn">See Current Date and Time</a> <!-- New link to /date -->
  </div>
</body>
</html>
